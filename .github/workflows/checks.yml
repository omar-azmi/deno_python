name: check

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup latest deno version
        uses: denoland/setup-deno@v2

  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup latest deno version
        uses: denoland/setup-deno@v2

      - name: Run deno task check
        run: deno task check

  test:
    name: test ${{ matrix.os }}, python-${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.13", "3.14", "3.15"]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2

      - name: Setup latest deno version
        uses: denoland/setup-deno@v2

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Bun
        if: ${{ matrix.os != 'windows-latest' }}
        uses: oven-sh/setup-bun@v1

      - name: Install find-libpython to find the interpreter's shared library (os-agnostic)
        run: python -m pip install find-libpython

      - name: Install NumPy
        run: python -m pip install numpy

      - name: Set the `DENO_PYTHON_PATH` variable os-agnostically using the installed python
        shell: bash
        env:
          PYTHON_BIN: ${{ steps.setup-python.outputs.python-path }}
        run: |
          SHARED_LIB_PATH=$("$PYTHON_BIN" -c "
          import find_libpython
          print(find_libpython.find_libpython())
          ")

          echo "DENO_PYTHON_PATH=$SHARED_LIB_PATH" >> "$GITHUB_ENV"

      - name: Run deno test
        run: deno task test
